name: open_authenticator
description: A cross-platform OTP app, free and open-source.
publish_to: none
version: 2.1.0+28
homepage: https://openauthenticator.app
repository: https://github.com/openauthenticator-app/openauthenticator
issue_tracker: https://github.com/openauthenticator-app/openauthenticator/issues
funding:
  - https://ko-fi.com/Skyost
  - https://paypal.me/Skyost

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  args: ^2.7.0
  meta: ^1.19.0
  animations: ^3.0.0
  flutter_riverpod: ^3.5.0
  simple_secure_storage: ^0.4.3
  jovial_svg: ^1.1.31
  jovial_misc: ^0.10.0
  mobile_scanner: ^7.5.0
  html: ^0.15.7
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  shared_preferences_linux: any
  shared_preferences_windows: any
  uuid: ^4.6.0
  equatable: ^3.0.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path: ^1.9.1
  local_auth: ^3.0.2
  local_auth_android: any
  local_auth_darwin: any
  local_auth_windows: any
  package_info_plus: ^10.2.2
  http: ^1.6.0
  qr_flutter: ^4.1.0
  intl: ^0.20.3
  url_launcher: ^6.3.3
  purchases_flutter: ^11.0.3
  purchases_ui_flutter: ^11.0.3
  purchases_dart:
    git:
      url: https://github.com/openauthenticator-app/purchases-dart.git
  window_manager: ^0.7.0
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  rate_my_app: ^2.4.2
  app_links: ^7.2.2
  hashlib: ^2.4.3
  convertlib: ^3.6.1
  cipherlib: ^0.7.2
  scrollable_positioned_list: ^0.3.8
  share_plus: ^13.3.1
  wakelock_plus: ^1.8.2
  file_picker: ^13.4.0
  connectivity_plus: ^7.3.2
  connectivity_plus_linux_portal: ^0.0.4
  sentry_flutter: ^10.5.0
  forui: ^0.28.0
  forui_assets: ^0.25.0
  custom_refresh_indicator: ^4.0.2
  # TODO: Remove Firebase dependencies once migration is finished.
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0

dev_dependencies:
  path_provider_platform_interface: ^2.1.3
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  msix: ^3.18.0
  riverpod_lint: ^3.2.0
  release: ^0.2.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/images/
    - assets/images/authentication/
    - assets/images/intro/

msix_config:
  display_name: Open Authenticator
  publisher_display_name: Skyost
  identity_name: 32411Skyost.OpenAuthenticator
  publisher: CN=13F97469-F5E7-4417-A3EC-E47287736FE3
  store: true
  logo_path: windows/msix.png
  languages: en, fr, de, pt, it
  trim_logo: false
  capabilities: internetClientServer
  protocol_activation: rc-653ef11675,otpauth,openauthenticator

release:
  changelog:
    header: '# 📰 Open Authenticator changelog'
    defaultIgnoredScopes: ['docs', 'version', 'deps', 'flatpak']
